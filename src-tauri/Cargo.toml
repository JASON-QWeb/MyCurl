[package]
name = "mycurl"
version = "0.1.0"
description = "MyCurl - 本地优先的 API 调试与 cURL 归档桌面工具"
authors = ["MyCurl"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "mycurl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "stream", "multipart", "socks"] }
futures-util = "0.3"
base64 = "0.22"
dirs = "5"
chrono = "0.4"
url = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
